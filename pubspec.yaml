name: hadith_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  awesome_snackbar_content: ^0.1.8
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  hugeicons: ^1.1.7
  image_picker: ^1.1.2
  lottie: ^3.3.3
  overlay_support: ^2.1.0
  reactive_forms: ^18.2.2
  shared_preferences: ^2.5.5
  toastification: ^3.2.0
  

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/lotties/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo.ttf

flutter_assets:
  assets_path: assets/
  output_path: lib/app/core/helper/
  filename: assets.dart